name: Release Extension Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Verification
        run: npm test

      - name: Build Extension Production Bundle
        run: npm run build

      - name: Resolve Release Version
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package Extension (.zip and .vsix)
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          cd dist
          zip -r "../xokj-${VERSION}.zip" .
          cd ..
          cp "xokj-${VERSION}.zip" "xokj-${VERSION}.vsix"
          ls -lh xokj-${VERSION}.*

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            xokj-${{ steps.vars.outputs.VERSION }}.zip
            xokj-${{ steps.vars.outputs.VERSION }}.vsix
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
